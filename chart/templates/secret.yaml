{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: hardwood
  labels:
    {{- include "hardwood.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secret.databaseUrl | b64enc }}
  SESSION_SECRET: {{ .Values.secret.sessionSecret | b64enc }}
{{- end }}
