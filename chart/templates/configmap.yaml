apiVersion: v1
kind: ConfigMap
metadata:
  name: hardwood
  labels:
    {{- include "hardwood.labels" . | nindent 4 }}
data:
  PUBLIC_URL: {{ printf "https://%s" .Values.hostname | quote }}
  EVENT_NAME: {{ .Values.event.name | quote }}
  EVENT_LOCALE: {{ .Values.event.locale | quote }}
  EVENT_TIMEZONE: {{ .Values.event.timezone | quote }}
  LARPIT_URL: {{ .Values.event.larpitUrl | quote }}
  {{- with .Values.event.gmPublicKey }}
  GM_PUBLIC_KEY: {{ . | quote }}
  {{- end }}
  PRISMA_DISABLE_TELEMETRY: "1"
  NEXT_TELEMETRY_DISABLED: "1"
