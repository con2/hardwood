name: cicd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/con2/hardwood

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost/hardwood
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost/hardwood_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma contract emit && git diff --exit-code -- src/prisma
      - run: npx prisma migration check
      - run: npm test
      - run: psql "postgresql://postgres:postgres@localhost/postgres" -c 'create database hardwood_test'
      - run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=,format=short
      - uses: docker/bake-action@v7
        with:
          push: true
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ steps.meta.outputs.version }}

  deploy:
    runs-on: qb-arc-runners
    needs: [test, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: |
          helm upgrade --install hardwood chart \
            --namespace larpit-hardwood \
            -f chart/values-production.yaml \
            --set image.repository=${{ env.IMAGE }} \
            --set image.tag=${{ needs.build.outputs.tag }} \
            --wait --timeout 300s
